<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="crypto-dashboard" aria-labelledby="dashboard-title">
      <header class="dashboard-header">
        <h2 id="dashboard-title">Marché en Temps Réel</h2>

        <p class="update-info">
          Mise à jour : <time id="last-update-time" datetime="">--:--:--</time>
        </p>
      </header>

      <figure class="table-wrapper">
        <table class="crypto-table">
          <caption class="sr-only">
            Liste des 10 principales crypto-monnaies
          </caption>

          <thead>
            <tr>
              <th scope="col" class="text-left">Actif</th>
              <th scope="col" class="text-right">Prix</th>
              <th scope="col" class="text-right">Var° 7j</th>
              <th scope="col" class="text-right">24h High/Low</th>
              <th scope="col" class="text-right">ATH %</th>
              <th scope="col" class="text-right">Mkt Cap</th>
            </tr>
          </thead>

          <tbody id="crypto-table-body"></tbody>
        </table>
      </figure>
    </section>
    <section class="crypto-details disabled">
      <header class="details-header">
        <div class="crypto-identity">
          <img id="detail-logo" src="" alt="" class="detail-logo" />
          <h2 id="detail-name">Crypto</h2>
        </div>

        <div class="tools-actions">
          <input
            type="radio"
            id="tool-cursor"
            name="tool"
            value="cursor"
            checked
            hidden
          />
          <label for="tool-cursor" class="btn-tool" title="Curseur">➤</label>

          <input type="radio" id="tool-box" name="tool" value="box" hidden />
          <label for="tool-box" class="btn-tool" title="Zone de Focus"
            >⬜</label
          >

          <div class="divider-vertical"></div>

          <button
            type="button"
            id="tool-eraser"
            class="btn-tool"
            title="Tout effacer"
          >
            🗑️
          </button>
        </div>

        <button type="button" id="exit" class="btn-exit" aria-label="Fermer">
          Fermer ✕
        </button>
      </header>

      <div class="canvas-container">
        <canvas id="chart-grid"></canvas>
        <canvas id="chart-data"></canvas>
        <canvas id="chart-user"></canvas>
        <canvas id="chart-draw"></canvas>
      </div>

      <footer class="chart-controls-bottom">
        <menu type="toolbar" class="time-filters" aria-label="Période">
          <li>
            <button type="button" class="time-btn active" data-days="1">
              1 jour
            </button>
          </li>
          <li>
            <button type="button" class="time-btn" data-days="7">
              7 jours
            </button>
          </li>
          <li>
            <button type="button" class="time-btn" data-days="30">
              1 mois
            </button>
          </li>
          <li>
            <button type="button" class="time-btn" data-days="90">
              3 mois
            </button>
          </li>
          <li>
            <button type="button" class="time-btn" data-days="365">1 an</button>
          </li>
        </menu>
      </footer>
    </section>
    <script type="module" src="./index.js"></script>
  </body>
</html>
